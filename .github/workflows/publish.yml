name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # Check out the exact tag the release was cut from — never whatever main
      # happens to hold at publish time.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (Trusted Publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      # Gate 1: the tag, package.json, and registry/glm-acp-agent/agent.json
      # must describe the same version before anything is built or packed.
      - name: Validate release tag / package / manifest version agreement
        run: node scripts/validate-release-version.mjs "${{ github.event.release.tag_name }}"

      - name: Install dependencies
        run: npm ci

      # Gate 2: the same lint + test + manifest-sync validation CI runs on every
      # push (shared composite action), so release checks cannot drift.
      - uses: ./.github/actions/verify-package

      # Pack exactly once. Everything below verifies and publishes THIS file —
      # never rebuild or repack between verification and publication.
      - name: Pack the release tarball (once)
        run: npm pack --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack-metadata.json"

      - name: Resolve tarball path and SHA-256
        run: |
          FILENAME=$(node -p "JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/pack-metadata.json', 'utf8'))[0].filename")
          echo "TARBALL=$RUNNER_TEMP/$FILENAME" >> "$GITHUB_ENV"
          SHA=$(sha256sum "$RUNNER_TEMP/$FILENAME" | cut -d' ' -f1)
          echo "TARBALL_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "Packed $RUNNER_TEMP/$FILENAME (sha256 $SHA)"

      # Gate 3: smoke the exact tarball that will be published — CLI help plus
      # a full ACP initialize / session/new / prompt handshake against a
      # loopback auth stub with a fake API key.
      - name: Packed package smoke test (exact release tarball)
        run: node scripts/packed-cli-smoke.mjs "$TARBALL"

      - name: Record the verified artifact
        run: echo "Publishing $TARBALL (sha256 $TARBALL_SHA256)"

      - name: Publish the verified tarball
        run: npm publish "$TARBALL" --provenance --access public

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Post-publish smoke test. npm publish above already validated the
      # tarball, so this is informational only and must never fail the release
      # (continue-on-error) — it just surfaces a warning if resolution can't be
      # confirmed within the propagation window.
      - name: Verify published package via bun x
        continue-on-error: true
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Two independent caches lag behind a fresh publish:
          #   1. npm's registry CDN serves a stale package manifest for ~1-2 min.
          #   2. Bun caches that manifest in ~/.bun/install/cache and reuses it,
          #      so a stale first fetch would poison every retry.
          # Give each attempt a fresh BUN_INSTALL_CACHE_DIR to force a re-fetch,
          # and retry until the CDN serves the just-published version.
          for i in $(seq 1 10); do
            if BUN_INSTALL_CACHE_DIR=$(mktemp -d) TMPDIR=$(mktemp -d) \
                bun x --package "glm-acp-agent@$VERSION" glm-acp-agent < /dev/null; then
              echo "Verified glm-acp-agent@$VERSION via bun x"
              exit 0
            fi
            echo "Attempt $i: glm-acp-agent@$VERSION not resolvable yet, waiting 15s for npm propagation..."
            sleep 15
          done
          echo "::warning::glm-acp-agent@$VERSION not resolvable via bun x within the propagation window (publish itself succeeded; verify manually with 'npm view glm-acp-agent version')"
